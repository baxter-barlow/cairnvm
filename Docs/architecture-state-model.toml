[durability]
level = [
  { name = "acknowledged", meaning = "accepted by the block engine; no restart-survival promise" },
  { name = "local-durable", meaning = "survives a process restart only on the same runtime" },
  { name = "published", meaning = "checkpoint creation returned success or was discovered remotely" },
  { name = "reconciled", meaning = "authenticated provider objects and independently trusted freshness anchor both reconciled to checkpoint identity, parent, references, and required head relationship" },
]

