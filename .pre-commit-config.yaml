minimum_pre_commit_version: "4.3.0"
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --all-packages python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run --locked --all-packages python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked --all-packages python -m mypy
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        entry: python3 scripts/verify_secret_scanner.py
        pass_filenames: false
        always_run: true
